# Reverse-proxy example for an NUF server on 127.0.0.1:8080.
#
# The health endpoint is the deployment gate: a rollout is only considered
# live once `GET /api/health` answers 200 through this proxy.

upstream nxl_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Never leak the server version.
    server_tokens off;

    # Health gate used by deploy/rollback scripts.
    location = /api/health {
        proxy_pass http://nxl_app;
        proxy_http_version 1.1;
        access_log off;
    }

    location / {
        proxy_pass http://nxl_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Graceful shutdown: let the upstream drain in-flight requests.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
