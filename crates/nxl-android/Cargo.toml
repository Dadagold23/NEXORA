[package]
name = "nxl-android"
version = "0.1.1"
edition = "2021"
publish = false

[lib]
name = "nxl_android"
# A C-compatible dynamic library is what an Android app loads through JNI.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The compiler's crypto stdlib hashes with the vetted `sha2` crate rather than
# a hand-written implementation. It is pure Rust with no system dependencies,
# so it links into the Android build; the server, database and FFI crates are
# still deliberately absent from this dependency list.
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
