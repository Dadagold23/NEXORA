[package]
name = "nxl-compiler"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nxlc"
path = "src/main.rs"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
mysql = "28.0.3"
postgres = "0.19.14"
rand = "0.10.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
