name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Each platform is built and self-tested on its own native runner. The
  # packaging script refuses to run on the wrong platform, so a mislabelled
  # binary cannot be produced.
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # An experimental target must not be able to block a release: if its runner
    # image is unavailable the job is skipped rather than failing the workflow.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runner labels track GitHub's image lifecycle: macos-13 was retired
          # in December 2025, ubuntu-22.04 is in its deprecation window, and
          # macos-14 retires on 2 November 2026.
          - { target: linux-x64,   os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm, experimental: true }
          - { target: macos-arm64, os: macos-15 }
          # macos-15-intel is GitHub's migration path for x86_64 macOS after
          # macos-13; package-release.sh checks the architecture with uname, so
          # this still stages and verifies a real macos-x64 package.
          - { target: macos-x64,   os: macos-15-intel }
          - { target: windows-x64, os: windows-latest, experimental: false }
    steps:
      - uses: actions/checkout@v4

      # ARM64 Linux is a best-effort target: if the runner image is unavailable
      # the job is skipped rather than blocking a release.
      - name: Check runner availability
        if: matrix.experimental
        run: |
          echo "experimental target; continuing"

      - uses: dtolnay/rust-toolchain@stable

      # shellcheck is Linux-only here: macOS has no apt-get, and installing it
      # through Homebrew on every macOS runner would make a linter worth more
      # than it costs. macOS instead proves the installer parses.
      - name: Install shellcheck (installer lint)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint the Unix installer
        if: runner.os == 'Linux'
        run: shellcheck install/unix/install.sh

      # bash is available on every runner, Windows included via Git bash, so
      # the syntax check runs everywhere rather than only where shellcheck does.
      - name: Verify the installer scripts parse
        shell: bash
        run: |
          bash -n install/unix/install.sh
          bash -n scripts/package-release.sh
          bash -n scripts/verify-install.sh

      - name: Package (runs fmt, clippy, tests, release build, staging, artifact tests)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-release.ps1
          else
            # bash, not sh: on Ubuntu /bin/sh is dash, which has no `set -o
            # pipefail`, so the scripts would die on their own first line.
            bash scripts/package-release.sh "${{ matrix.target }}"
          fi

      # Re-run the onboarding checklist against the archive this runner just
      # produced. This runs before the upload so an artifact that fails
      # installation or execution is never published.
      - name: Verify the archive like a new user
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-install.ps1
          else
            bash scripts/verify-install.sh "dist/NEXORA-"*.tar.gz
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect archives from every platform
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build the platform manifest and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          cp artifacts/*.tar.gz artifacts/*.zip dist/ 2>/dev/null || true
          (cd dist && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS 2>/dev/null || true)
          {
            echo "# NEXORA release manifest"
            echo
            echo "| Platform | Archive | Size | SHA-256 |"
            echo "| --- | --- | --- | --- |"
          } > dist/MANIFEST.md
          for archive in dist/*.tar.gz dist/*.zip; do
            [ -f "$archive" ] || continue
            name="$(basename "$archive")"
            size="$(du -h "$archive" | cut -f1)"
            hash="$(sha256sum "$archive" | cut -d' ' -f1)"
            target="${name#NEXORA-}"
            target="${target#*-}"
            target="${target%.tar.gz}"
            target="${target%.zip}"
            echo "| $target | $name | $size | \`$hash\` |" >> dist/MANIFEST.md
          done
          cat dist/MANIFEST.md
          ls -la dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true